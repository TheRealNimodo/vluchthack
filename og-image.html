<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; background: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 80px; border: 1px solid #e5e7eb; }
.tag { display: inline-block; background: #eff6ff; color: #2563ff; font-size: 18px; font-weight: 600; padding: 6px 18px; border-radius: 99px; margin-bottom: 24px; }
h1 { font-size: 64px; font-weight: 800; color: #111827; line-height: 1.1; margin-bottom: 20px; letter-spacing: -.03em; }
h1 em { color: #2563ff; font-style: normal; }
p { font-size: 24px; color: #6b7280; margin-bottom: 40px; }
.stats { display: flex; gap: 40px; }
.stat b { font-size: 28px; font-weight: 800; color: #2563ff; display: block; }
.stat span { font-size: 14px; color: #9ca3af; }
.logo { position: absolute; top: 48px; left: 80px; font-size: 22px; font-weight: 800; color: #111827; }
.logo em { color: #2563ff; font-style: normal; }
</style>
</head>
<body>
<div class="logo">✈ Vlucht<em>Hack</em></div>
<div class="tag">AI vliegticket analyse</div>
<h1>Goedkoper vliegen<br>met <em>AI</em></h1>
<p>7 strategieën · tot 40% besparing · gratis · 60 seconden</p>
<div class="stats">
  <div class="stat"><b>7</b><span>AI-strategieën</span></div>
  <div class="stat"><b>tot 40%</b><span>besparing</span></div>
  <div class="stat"><b>gratis</b><span>geen account nodig</span></div>
</div>
</body>
</html>
